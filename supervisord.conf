[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

[program:dropbear]
command=/usr/sbin/dropbear -F -E -p 127.0.0.1:22 -R
autostart=true
autorestart=true
priority=20
startsecs=2
startretries=10

[program:bore]
command=/usr/local/bin/bore-wrapper.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/bore.log
stderr_logfile=/var/log/bore.log
priority=30
startsecs=3
startretries=999

[program:sftp-updater]
command=/usr/local/bin/update-sftp.sh
autostart=true
autorestart=true
priority=40
